name: Check for Local SEO updates

# Runs every day at 07:00 UTC, and whenever you press the button manually.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch updates from the official feeds
        id: fetch
        run: node .github/scripts/fetch-updates.mjs

      - name: Commit anything new
        run: |
          git config user.name "local-seo-updates"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/updates.js data/updates.json; then
            echo "No changes."
          else
            git add data/updates.js data/updates.json
            git commit -m "Update feed: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Opening an issue is what actually emails you.
      # Watching a repository does NOT notify you about commits.
      - name: Open an issue so you get an email
        if: steps.fetch.outputs.added != '0' && steps.fetch.outputs.added != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🆕 ${{ steps.fetch.outputs.added }} new Local SEO update(s) — $(date -u +%Y-%m-%d)" \
            --body-file new-updates.md
