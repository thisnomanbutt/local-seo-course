<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local SEO Mastery</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">Local SEO Mastery</span>
    <span class="brand-meta" id="brandMeta">loading…</span>
  </div>
  <div class="topbar-right">
    <div class="bell-wrap">
      <button class="bell" id="bellBtn" title="Announcements" aria-label="Announcements">
        <span class="bell-ico">🔔</span>
        <span class="bell-dot" id="bellCount" hidden>0</span>
      </button>
      <div class="bell-panel" id="bellPanel" hidden></div>
    </div>
    <div class="search-wrap">
      <span class="search-ico">⌕</span>
      <input id="searchInput" type="search" placeholder="Search lessons…" autocomplete="off">
      <div id="searchResults" class="search-results" hidden></div>
    </div>
  </div>
</header>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="side-progress">
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
        <circle class="ring-fg" id="ringFg" cx="22" cy="22" r="19"></circle>
      </svg>
      <div>
        <div class="side-pct" id="sidePct">0%</div>
        <div class="side-sub" id="sideSub">0 of 240 lessons complete</div>
      </div>
    </div>

    <a class="side-card side-card--upd" href="#/updates" id="updatesCard">
      <span class="sc-icon">🆕</span>
      <span class="sc-body">
        <span class="sc-title">New Update</span>
        <span class="sc-sub" id="updatesSub">Official sources · never checked</span>
      </span>
      <span class="sc-count" id="updatesCount" hidden>0</span>
    </a>

    <a class="side-card side-card--start" href="#/home" id="continueCard">
      <span class="sc-badge">START</span>
      <span class="sc-body">
        <span class="sc-title" id="continueTitle">Begin the course</span>
        <span class="sc-sub" id="continueSub">Lesson 1.1.1 · not started</span>
      </span>
    </a>

    <a class="side-card side-card--dash" href="#/home">📊 Progress dashboard</a>

    <div class="chips" id="filterChips">
      <button class="chip is-on" data-filter="all">All</button>
      <button class="chip" data-filter="done">✅ Done</button>
      <button class="chip" data-filter="important">⭐ Important</button>
      <button class="chip" data-filter="saved">🔖 Saved</button>
      <button class="chip" data-filter="notes">📝 Notes</button>
      <button class="chip" data-filter="unfinished">◑ Unfinished</button>
    </div>

    <nav class="tree" id="tree"></nav>
  </aside>

  <main class="main" id="main"></main>

</div>

<div class="toast" id="toast" hidden></div>

<!-- updates feed -->
<script src="data/updates.js"></script>

<!-- curriculum index -->
<script src="data/curriculum.js"></script>

<!-- lesson content: one file per module -->
<script src="data/l1m1.js"></script>
